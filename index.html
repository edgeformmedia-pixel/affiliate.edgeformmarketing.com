<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Edgeform Affiliates</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="auth">
  <div class="auth-card fade-in">
    <div class="brand"><span class="brand-mark">E</span><span>Edgeform <em>Affiliates</em></span></div>
    <div class="panel panel-pad" id="card">
      <form id="login-form" novalidate>
        <h1>Sign in</h1>
        <p>Enter the email your Edgeform manager has on file. We'll email you a link to sign in.</p>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
        </div>
        <button class="btn" type="submit" id="submit">Email me a sign-in link</button>
        <div class="form-error" id="error" role="alert" hidden></div>
      </form>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="mock-api.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
  if (Api.getSession()) location.replace('dashboard.html');

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const email = document.getElementById('email').value.trim();
    errorEl.hidden = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errorEl.textContent = 'Enter a valid email address.';
      errorEl.hidden = false;
      return;
    }
    submit.disabled = true;
    submit.textContent = 'Sending…';
    try {
      await Api.post('/auth/magic-link', { email });
      document.getElementById('card').innerHTML = `
        <h1>Check your email</h1>
        <p>If <strong>${UI.esc(email)}</strong> belongs to an Edgeform affiliate, a sign-in link is on its way. It expires in 15 minutes.</p>
        <button class="btn btn-ghost" onclick="location.reload()">Use a different email</button>
        ${Api.isMock ? `<div class="dev-link">Mock mode: <a href="verify.html?token=${MockApi.LOGIN_TOKEN}">open the sign-in link</a></div>` : ''}`;
    } catch (error) {
      errorEl.textContent = UI.errorMessage(error);
      errorEl.hidden = false;
      submit.disabled = false;
      submit.textContent = 'Email me a sign-in link';
    }
  });
</script>
</body>
</html>
